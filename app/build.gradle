plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.abdullah.flightscry'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abdullah.flightscry'
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The exact Backpack version named in the Forage Task 3 instructions.
    implementation 'net.skyscanner.backpack:backpack-android:43.0.0'
}

